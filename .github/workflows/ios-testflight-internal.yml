name: iOS Internal TestFlight

on:
  push:
    branches:
      - fix/auth-location-calendar-agenda
  workflow_dispatch:
    inputs:
      upload_testflight:
        description: Upload the signed IPA to TestFlight
        required: true
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  build-ios:
    name: Build and upload iOS IPA
    runs-on: macos-latest
    timeout-minutes: 60

    env:
      BUNDLE_ID: com.free2bapp.mobile
      APPLE_TEAM_ID: Y89WLT6JJ7
      IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
      IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
      IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
      IOS_KEYCHAIN_PASSWORD: ${{ secrets.IOS_KEYCHAIN_PASSWORD }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate iOS signing and upload secrets
        run: |
          missing=0
          for name in \
            IOS_CERTIFICATE_BASE64 \
            IOS_CERTIFICATE_PASSWORD \
            IOS_PROVISIONING_PROFILE_BASE64 \
            IOS_KEYCHAIN_PASSWORD \
            APP_STORE_CONNECT_ISSUER_ID \
            APP_STORE_CONNECT_KEY_ID \
            APP_STORE_CONNECT_PRIVATE_KEY
          do
            if [ -z "${!name}" ]; then
              echo "$name is not configured."
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.29.3"
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Prepare Flutter iOS layout
        run: |
          mkdir -p ios
          cp -R Runner Runner.xcodeproj Runner.xcworkspace RunnerTests Flutter Podfile ios/

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        continue-on-error: true
        run: flutter analyze

      - name: Install Apple signing certificate and profile
        run: |
          CERTIFICATE_PATH="$RUNNER_TEMP/ios_distribution.p12"
          PROFILE_PATH="$RUNNER_TEMP/free2b_appstore.mobileprovision"
          PROFILE_PLIST_PATH="$RUNNER_TEMP/free2b_appstore.plist"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          export CERTIFICATE_PATH PROFILE_PATH

          python3 - <<'PY'
          import base64
          import os
          import pathlib
          import sys

          outputs = {
              "IOS_CERTIFICATE_BASE64": pathlib.Path(os.environ["CERTIFICATE_PATH"]),
              "IOS_PROVISIONING_PROFILE_BASE64": pathlib.Path(os.environ["PROFILE_PATH"]),
          }

          for env_name, output_path in outputs.items():
              encoded = os.environ.get(env_name, "")
              compact = "".join(encoded.split())
              if not compact:
                  print(f"{env_name} is configured but empty after whitespace normalization.")
                  sys.exit(1)
              try:
                  decoded = base64.b64decode(compact, validate=True)
              except Exception as error:
                  print(f"{env_name} is not valid Base64: {error}")
                  sys.exit(1)
              if not decoded:
                  print(f"{env_name} decoded to an empty file.")
                  sys.exit(1)
              output_path.write_bytes(decoded)
              print(f"Decoded {env_name} to {output_path.name} ({len(decoded)} bytes).")
          PY

          if ! security cms -D -i "$PROFILE_PATH" > "$PROFILE_PLIST_PATH"; then
            echo "Provisioning profile could not be decoded as a signed mobileprovision file."
            exit 1
          fi

          PROFILE_TEAM_ID="$(/usr/libexec/PlistBuddy -c 'Print TeamIdentifier:0' "$PROFILE_PLIST_PATH")"
          PROFILE_BUNDLE_ID="$(/usr/libexec/PlistBuddy -c 'Print Entitlements:application-identifier' "$PROFILE_PLIST_PATH" | sed "s/^${PROFILE_TEAM_ID}\.//")"
          if [ "$PROFILE_TEAM_ID" != "$APPLE_TEAM_ID" ]; then
            echo "Provisioning profile team ID does not match APPLE_TEAM_ID."
            exit 1
          fi
          if [ "$PROFILE_BUNDLE_ID" != "$BUNDLE_ID" ]; then
            echo "Provisioning profile bundle identifier does not match BUNDLE_ID."
            exit 1
          fi

          security create-keychain -p "$IOS_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$IOS_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$IOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$IOS_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          PROFILE_UUID="$(/usr/libexec/PlistBuddy -c 'Print UUID' "$PROFILE_PLIST_PATH")"
          PROFILE_NAME="$(/usr/libexec/PlistBuddy -c 'Print Name' "$PROFILE_PLIST_PATH")"
          echo "Installed provisioning profile '$PROFILE_NAME' for $PROFILE_BUNDLE_ID."
          cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"

          {
            echo "IOS_PROFILE_UUID=$PROFILE_UUID"
            echo "IOS_PROFILE_NAME=$PROFILE_NAME"
          } >> "$GITHUB_ENV"

      - name: Create export options
        run: |
          printf '<?xml version="1.0" encoding="UTF-8"?><!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd"><plist version="1.0"><dict/></plist>' > ios/ExportOptions.plist
          /usr/libexec/PlistBuddy -c 'Add method string app-store' ios/ExportOptions.plist
          /usr/libexec/PlistBuddy -c 'Add signingStyle string manual' ios/ExportOptions.plist
          /usr/libexec/PlistBuddy -c "Add teamID string $APPLE_TEAM_ID" ios/ExportOptions.plist
          /usr/libexec/PlistBuddy -c 'Add uploadBitcode bool false' ios/ExportOptions.plist
          /usr/libexec/PlistBuddy -c 'Add uploadSymbols bool true' ios/ExportOptions.plist
          /usr/libexec/PlistBuddy -c 'Add provisioningProfiles dict' ios/ExportOptions.plist
          /usr/libexec/PlistBuddy -c "Add provisioningProfiles:$BUNDLE_ID string $IOS_PROFILE_NAME" ios/ExportOptions.plist

      - name: Build signed IPA
        run: flutter build ipa --release --export-options-plist=ios/ExportOptions.plist

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: free2b-ios-internal-ipa
          path: build/ios/ipa/*.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Upload to TestFlight
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.upload_testflight == true)
        run: |
          IPA_PATH="$(find build/ios/ipa -type f -name '*.ipa' -print -quit)"
          if [ -z "$IPA_PATH" ]; then
            echo "No IPA found to upload."
            exit 1
          fi

          mkdir -p "$HOME/.appstoreconnect/private_keys"
          printf '%s' "$APP_STORE_CONNECT_PRIVATE_KEY" > "$HOME/.appstoreconnect/private_keys/AuthKey_$APP_STORE_CONNECT_KEY_ID.p8"

          xcrun altool \
            --upload-app \
            --type ios \
            --file "$IPA_PATH" \
            --apiKey "$APP_STORE_CONNECT_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID"
